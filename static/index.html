<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RoboDad</title>
<meta name="description" content="RoboDad: a friendly robot dad who helps with everyday life skills.">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#E8EFF5; --surface:#FFFFFF; --ink:#1B2A3A; --muted:#5A6B7E; --line:#D3DEE8;
  --denim:#2E5C8A; --denim-ink:#FFFFFF; --mustard:#F2B533; --mustard-ink:#2A1E00;
  --metal:#B9C7D4; --alert:#B3412E; --ok:#2F7D5B;
  --radius:18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#101821; --surface:#1A2632; --ink:#E5EDF5; --muted:#9AAABB; --line:#2B3A49;
    --denim:#4C80B8; --metal:#55687A; --alert:#E07A66; --ok:#5FBF93; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --sky:#101821; --surface:#1A2632; --ink:#E5EDF5; --muted:#9AAABB; --line:#2B3A49;
  --denim:#4C80B8; --metal:#55687A; --alert:#E07A66; --ok:#5FBF93; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--sky); color:var(--ink);
  font-family:"Nunito", ui-rounded, system-ui, sans-serif; font-size:17px; line-height:1.5;
  display:flex; flex-direction:column;
}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mustard); outline-offset:2px; border-radius:8px}

/* ---------- header ---------- */
.top{
  display:flex; align-items:center; gap:12px;
  padding:12px 16px; border-bottom:1px solid var(--line); background:var(--surface);
}
.top .who{flex:1; min-width:0}
.top h1{margin:0; font-size:1.25rem; font-weight:900; letter-spacing:-.01em}
.status{margin:0; font-size:.85rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.status .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:6px; vertical-align:1px}
.status.classic .dot{background:var(--mustard)}
.ghost{
  border:1px solid var(--line); background:transparent; border-radius:999px;
  padding:6px 14px; font-weight:700; font-size:.9rem; cursor:pointer;
}
.ghost:hover{background:var(--sky)}

/* ---------- avatar ---------- */
.bot{flex:none; display:block}
.bot .light{fill:var(--mustard)}
.thinking .bot .light{animation:blink .7s steps(2,start) infinite}
@keyframes blink{to{fill:var(--metal)}}

/* ---------- conversation ---------- */
main{flex:1; overflow-y:auto; scroll-behavior:smooth}
.log{max-width:720px; margin:0 auto; padding:24px 16px 8px; display:flex; flex-direction:column; gap:18px}

.hello{padding:32px 0 8px; display:flex; flex-direction:column; align-items:flex-start; gap:14px}
.hello h2{margin:0; font-size:clamp(2rem, 6vw, 2.9rem); line-height:1.05; font-weight:900; letter-spacing:-.02em; max-width:14ch}
.hello p{margin:0; color:var(--muted); max-width:46ch}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.chip{
  border:1.5px solid var(--denim); color:var(--denim); background:transparent;
  border-radius:999px; padding:7px 14px; font-weight:700; font-size:.95rem; cursor:pointer;
}
.chip:hover{background:var(--denim); color:var(--denim-ink)}

.msg{display:flex; gap:10px; align-items:flex-end; max-width:100%}
.msg.user{justify-content:flex-end}
.bubble{
  padding:11px 15px; border-radius:var(--radius); max-width:min(560px, 85%);
  overflow-wrap:anywhere;
}
.user .bubble{background:var(--denim); color:var(--denim-ink); border-bottom-right-radius:6px}
.robo .bubble{background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:6px}
.robo .stack{display:flex; flex-direction:column; gap:6px; min-width:0; max-width:min(560px, 85%)}
.robo .stack .bubble{max-width:100%}
.bubble p{margin:0 0 .6em} .bubble p:last-child{margin:0}
.bubble ol,.bubble ul{margin:.3em 0 .6em; padding-left:1.3em}
.bubble.safety{border:2px solid var(--alert)}
.typing{display:inline-flex; gap:4px; padding:4px 0}
.typing i{width:7px; height:7px; border-radius:50%; background:var(--muted); animation:hop 1s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes hop{50%{transform:translateY(-4px); opacity:.5}}
.notice{font-size:.85rem; color:var(--muted); padding-left:4px}

/* ---------- NLP insight panel ---------- */
details.why{font-size:.85rem; color:var(--muted); padding-left:4px}
details.why summary{cursor:pointer; font-weight:700; list-style:none; display:inline-flex; gap:6px; align-items:center}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"+"; font-weight:900; width:1em; text-align:center}
details.why[open] summary::before{content:"–"}
.why .grid{
  margin-top:8px; padding:12px 14px; border-radius:12px; background:var(--surface); border:1px dashed var(--line);
  display:grid; grid-template-columns:max-content 1fr; gap:6px 14px; color:var(--ink);
}
.why dt{color:var(--muted)} .why dd{margin:0; min-width:0}
.bar{height:6px; border-radius:3px; background:var(--line); margin-top:5px; max-width:180px}
.bar span{display:block; height:100%; border-radius:3px; background:var(--denim)}
.tag{display:inline-block; padding:0 8px; border-radius:6px; background:var(--sky); margin:0 4px 4px 0; font-weight:700}
.ex{margin:0; padding-left:1.1em} .ex li{margin-bottom:4px}
.ex q{font-style:italic}

/* ---------- composer ---------- */
.composer{background:linear-gradient(to top, var(--sky) 70%, transparent); padding:8px 16px calc(12px + env(safe-area-inset-bottom))}
form{max-width:720px; margin:0 auto; display:flex; gap:8px; align-items:flex-end;
  background:var(--surface); border:1.5px solid var(--line); border-radius:24px; padding:6px 6px 6px 16px}
form:focus-within{border-color:var(--denim)}
textarea:focus-visible{outline:none}
form:focus-within{box-shadow:0 0 0 3px color-mix(in srgb, var(--mustard) 55%, transparent)}
textarea{flex:1; border:0; outline:0; resize:none; background:transparent; padding:8px 0; max-height:160px; line-height:1.4}
textarea::placeholder{color:var(--muted)}
.send{
  flex:none; border:0; border-radius:999px; background:var(--mustard); color:var(--mustard-ink);
  font-weight:900; padding:10px 18px; cursor:pointer;
}
.send:disabled{opacity:.45; cursor:default}
.fine{max-width:720px; margin:6px auto 0; font-size:.78rem; color:var(--muted); text-align:center}

@media (max-width:520px){
  body{font-size:16px}
  .robo .bot-mini{display:none}
  .bubble,.robo .stack{max-width:92%}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; scroll-behavior:auto!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="robodad" viewBox="0 0 64 64">
    <line x1="32" y1="4" x2="32" y2="13" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
    <circle class="light" cx="32" cy="5" r="4.5"/>
    <rect x="8" y="13" width="48" height="40" rx="14" fill="var(--metal)" stroke="var(--ink)" stroke-width="3"/>
    <rect x="3" y="27" width="6" height="12" rx="3" fill="var(--ink)"/>
    <rect x="55" y="27" width="6" height="12" rx="3" fill="var(--ink)"/>
    <circle cx="23" cy="29" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
    <circle cx="41" cy="29" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2.5"/>
    <circle cx="24" cy="29.5" r="2" fill="var(--ink)"/>
    <circle cx="42" cy="29.5" r="2" fill="var(--ink)"/>
    <path d="M18 41c4-4 9-4 14 0 5-4 10-4 14 0-3 5-9 5-14 2-5 3-11 3-14-2z" fill="var(--ink)"/>
  </symbol>
</svg>

<header class="top">
  <svg class="bot" width="44" height="44" aria-hidden="true"><use href="#robodad"/></svg>
  <div class="who">
    <h1>RoboDad</h1>
    <p class="status" id="status"><span class="dot"></span>Starting up…</p>
  </div>
  <button class="ghost" id="newChat" type="button">New chat</button>
</header>

<main id="scroller">
  <div class="log" id="log" aria-live="polite">
    <section class="hello" id="hello">
      <svg class="bot" width="88" height="88" aria-hidden="true"><use href="#robodad"/></svg>
      <h2>Hey kiddo. What's on your mind?</h2>
      <p>I can help with snacks, chores, homework, sleep, money, friends, big feelings, or a terrible joke.</p>
      <div class="chips">
        <button class="chip" type="button">I'm hungry, what should I eat?</button>
        <button class="chip" type="button">How do I do my laundry?</button>
        <button class="chip" type="button">I'm nervous about a test tomorrow</button>
        <button class="chip" type="button">Tell me a dad joke</button>
      </div>
    </section>
  </div>
</main>

<div class="composer">
  <form id="form" autocomplete="off">
    <label for="input" class="sr" style="position:absolute;left:-9999px">Message RoboDad</label>
    <textarea id="input" rows="1" maxlength="1000" placeholder="Talk to RoboDad…"></textarea>
    <button class="send" id="send" type="submit" disabled>Send</button>
  </form>
  <p class="fine">RoboDad is an AI, not a real parent, and can get things wrong. Never share your address or passwords. In an emergency, call 911.</p>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $("log"), form = $("form"), input = $("input"), send = $("send"),
        scroller = $("scroller"), statusEl = $("status"), hello = $("hello");
  const KEY = "robodad.chat.v1";
  let history = [];   // [{role, content, meta?}]
  let busy = false;

  // ---------- storage (best effort) ----------
  const save = () => { try { sessionStorage.setItem(KEY, JSON.stringify(history.slice(-60))); } catch {} };
  const load = () => { try { return JSON.parse(sessionStorage.getItem(KEY) || "[]"); } catch { return []; } };

  // ---------- tiny, safe markdown ----------
  const esc = (s) => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function md(text){
    const blocks = esc(text.trim()).split(/\n{2,}/);
    const inline = s => s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<em>$2</em>");
    const OL = /^\s*\d+[.)]\s/, UL = /^\s*[-•*]\s/;
    const kind = l => OL.test(l) ? "ol" : UL.test(l) ? "ul" : "p";
    return blocks.map(b => {
      // group consecutive lines of the same kind: text, numbered list, bullet list
      const runs = [];
      for (const l of b.split("\n")) {
        const k = kind(l), last = runs[runs.length - 1];
        if (last && last.k === k) last.lines.push(l); else runs.push({ k, lines:[l] });
      }
      return runs.map(({k, lines}) => k === "p"
        ? "<p>" + lines.map(inline).join("<br>") + "</p>"
        : `<${k}>` + lines.map(l => "<li>" + inline(l.replace(k === "ol" ? OL : UL, "")) + "</li>").join("") + `</${k}>`
      ).join("");
    }).join("");
  }

  // ---------- rendering ----------
  const scrollDown = () => { scroller.scrollTop = scroller.scrollHeight; };

  function addUser(text){
    hello.hidden = true;
    const el = document.createElement("div");
    el.className = "msg user";
    el.innerHTML = `<div class="bubble">${md(text)}</div>`;
    log.appendChild(el); scrollDown();
  }

  function addRobo(){
    hello.hidden = true;
    const el = document.createElement("div");
    el.className = "msg robo";
    el.innerHTML = `<svg class="bot bot-mini" width="34" height="34" aria-hidden="true"><use href="#robodad"/></svg>
      <div class="stack"><div class="bubble"><span class="typing" aria-label="RoboDad is typing"><i></i><i></i><i></i></span></div></div>`;
    log.appendChild(el); scrollDown();
    return { bubble: el.querySelector(".bubble"), stack: el.querySelector(".stack") };
  }

  const pct = (x) => Math.round(x * 100);
  const intentLabel = (s) => s === "fallback" ? "not sure (fallback)" : s.replace(/^life_skill_/,"").replace(/_/g," ");
  const modeLabel = (m) => ({llm:"AI model, grounded by the NLP pipeline", classic:"Classic intent classifier", safety:"Safety guardrail (fixed message, no AI)"}[m] || m);

  function renderWhy(stack, meta, totalMs){
    if (!meta) return;
    const s = meta.sentiment || {};
    const mood = s.compound <= -0.3 ? "Negative" : s.compound >= 0.3 ? "Positive" : "Neutral";
    const ents = (meta.entities||[]).map(e => `<span class="tag">${esc(e.text)} · ${esc(e.label.toLowerCase().replace("_"," "))}</span>`).join("") || "None found";
    const ex = (meta.examples||[]).map(e => `<li><q>${esc(e.user)}</q> (${pct(e.similarity)}% match)</li>`).join("");
    const d = document.createElement("details");
    d.className = "why";
    d.innerHTML = `<summary>How RoboDad read this</summary>
      <dl class="grid">
        <dt>Answered by</dt><dd>${esc(modeLabel(meta.mode))}${meta.model ? `<br><small>${esc(meta.model)}</small>` : ""}</dd>
        <dt>Intent</dt><dd>${esc(intentLabel(meta.intent))} · ${pct(meta.confidence)}% sure<div class="bar"><span style="width:${pct(meta.confidence)}%"></span></div></dd>
        <dt>Mood</dt><dd>${mood} (${(s.compound ?? 0).toFixed(2)})</dd>
        <dt>Entities</dt><dd>${ents}</dd>
        ${ex ? `<dt>Similar examples</dt><dd><ul class="ex">${ex}</ul></dd>` : ""}
        <dt>Timing</dt><dd>NLP ${meta.nlp_ms} ms${totalMs ? ` · full reply ${(totalMs/1000).toFixed(2)} s` : ""}</dd>
      </dl>`;
    stack.appendChild(d);
  }

  function addNotice(stack, text){
    const p = document.createElement("p");
    p.className = "notice"; p.textContent = text; stack.appendChild(p);
  }

  // ---------- networking ----------
  async function ask(){
    busy = true; send.disabled = true; document.body.classList.add("thinking");
    const { bubble, stack } = addRobo();
    let text = "", meta = null, totalMs = null, first = true;
    const payload = { messages: history.map(({role, content}) => ({role, content})) };

    try {
      const res = await fetch("/api/chat", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(payload) });
      if (!res.ok) {
        let msg = "RoboDad couldn't reply. Check your connection and send your message again.";
        try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
        throw new Error(msg);
      }
      const reader = res.body.getReader(); const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream:true });
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const raw = buf.slice(0, i); buf = buf.slice(i + 2);
          const ev = /^event: (.+)$/m.exec(raw)?.[1]; const data = /^data: (.*)$/m.exec(raw)?.[1];
          if (!ev || data === undefined) continue;
          const obj = JSON.parse(data);
          if (ev === "meta") { meta = obj; if (obj.mode === "safety") bubble.classList.add("safety"); }
          else if (ev === "mode") { meta = {...meta, mode: obj.mode}; addNotice(stack, obj.reason); }
          else if (ev === "token") {
            text += obj;
            if (first) { first = false; }
            bubble.innerHTML = md(text); scrollDown();
          }
          else if (ev === "done") totalMs = obj.total_ms;
        }
      }
      if (!text) throw new Error("RoboDad went quiet. Send your message again.");
      history.push({ role:"assistant", content:text, meta, totalMs });
      save();
      renderWhy(stack, meta, totalMs);
    } catch (err) {
      bubble.innerHTML = md(err.message || String(err));
      bubble.classList.add("safety");
      // drop the unanswered user turn so a resend doesn't duplicate it
      const last = history.pop(); input.value = last?.content || ""; autosize();
    } finally {
      busy = false; document.body.classList.remove("thinking");
      send.disabled = !input.value.trim(); scrollDown();
    }
  }

  function submit(text){
    text = text.trim();
    if (!text || busy) return;
    history.push({ role:"user", content:text });
    addUser(text);
    input.value = ""; autosize();
    ask();
  }

  // ---------- events ----------
  function autosize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
  input.addEventListener("input", () => { autosize(); send.disabled = busy || !input.value.trim(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(input.value); }
  });
  form.addEventListener("submit", (e) => { e.preventDefault(); submit(input.value); });
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => submit(c.textContent)));
  $("newChat").addEventListener("click", () => {
    history = []; save();
    log.querySelectorAll(".msg").forEach(n => n.remove());
    hello.hidden = false; input.focus();
  });

  // ---------- boot ----------
  fetch("/api/status").then(r => r.json()).then(s => {
    statusEl.classList.toggle("classic", s.mode !== "llm");
    statusEl.innerHTML = `<span class="dot"></span>` + (s.mode === "llm"
      ? `Online · ${esc(s.model)}`
      : `Classic mode · ${s.intents} intents, ${s.examples} examples`);
  }).catch(() => { statusEl.innerHTML = `<span class="dot"></span>Offline`; });

  for (const m of load()) {
    history.push(m);
    if (m.role === "user") addUser(m.content);
    else { const { bubble, stack } = addRobo(); bubble.innerHTML = md(m.content); if (m.meta?.mode === "safety") bubble.classList.add("safety"); renderWhy(stack, m.meta, m.totalMs); }
  }
  input.focus();
})();
</script>
</body>
</html>
