# Keeps the free Render server awake so visitors don't wait ~30 seconds for it
# to start. GitHub runs this every 10 minutes for free on public repositories.
# (GitHub pauses scheduled jobs after 60 days with no commits; any commit, or
# "Enable workflow" on the Actions tab, turns it back on.)
name: Keep RoboDad awake
on:
  schedule:
    - cron: "7-59/10 * * * *"   # off the busy :00 minutes, which GitHub often skips
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 60 https://robodad.onrender.com/health
